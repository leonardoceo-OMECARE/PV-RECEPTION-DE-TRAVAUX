<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PV de réception de travaux · OMECARE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,600..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============ CONFIG ============
   API_BASE : URL de base des webhooks n8n (ex. https://n8n.omecare.fr/webhook)
   Laisser vide = mode démo (données du devis TOURS 37, rien n'est envoyé). */
:root{
  --paper:#EBEFEE; --card:#FFFFFF; --ink:#16272A; --muted:#58696B; --line:#D2DAD9;
  --blue:#1D4F91; --blue-soft:#E3ECF8;
  --ok:#2E8B57; --res:#C58A0A; --nc:#C23B2A; --nr:#7C1D2C; --nv:#8D989A; --empty:#C9D1D0;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 132px)}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 120px}
h1,h2,h3{font-family:var(--display);font-stretch:80%;line-height:1.1;margin:0}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.08rem;font-weight:700;font-stretch:90%}
p{margin:.4em 0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.demo-bar{background:var(--ink);color:#fff;font-size:.85rem;padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.demo-bar button{background:transparent;border:1px solid #ffffff66;color:#fff;border-radius:999px;padding:3px 12px}
.demo-bar button[aria-pressed=true]{background:#fff;color:var(--ink)}

/* Header + plan de chantier (la jauge) */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--paper)}
.top-in{max-width:760px;margin:0 auto;padding:12px 16px 10px}
.top-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.role{font-size:.85rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue);white-space:nowrap}
.gauge{display:flex;gap:3px;margin-top:10px}
.gauge .lot{flex:var(--n) 1 0;display:flex;gap:1px;border:0;padding:0;background:none;min-width:0}
.gauge i{flex:1;height:14px;background:var(--empty);display:block}
.gauge .lot i:first-child{border-radius:3px 0 0 3px}.gauge .lot i:last-child{border-radius:0 3px 3px 0}
.gauge i.ok{background:var(--ok)}.gauge i.res{background:var(--res)}.gauge i.nc{background:var(--nc)}.gauge i.nr{background:var(--nr)}.gauge i.nv{background:var(--nv)}
.gauge-legend{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-top:4px}

/* Cartes / sections */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.lot-head{display:flex;justify-content:space-between;align-items:baseline;margin:28px 2px 8px}
.pt{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--empty);border-radius:10px;padding:14px 14px 12px;margin-bottom:10px}
.pt[data-s=ok]{border-left-color:var(--ok)}.pt[data-s=res]{border-left-color:var(--res)}.pt[data-s=nc]{border-left-color:var(--nc)}.pt[data-s=nr]{border-left-color:var(--nr)}.pt[data-s=nv]{border-left-color:var(--nv)}
.pt.missing{box-shadow:0 0 0 2px var(--nc)}
.pt-title{font-weight:700;line-height:1.3}
.pt-meta{font-size:.85rem;color:var(--muted);margin-top:2px}
.pt-crit{font-size:.92rem;margin:8px 0 0;color:#2c3e41}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:9px 2px;font-size:.78rem;font-weight:700;line-height:1.15;min-height:48px}
.seg button[aria-pressed=true][data-k=ok]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button[aria-pressed=true][data-k=res]{background:var(--res);border-color:var(--res);color:#fff}
.seg button[aria-pressed=true][data-k=nc]{background:var(--nc);border-color:var(--nc);color:#fff}
.seg button[aria-pressed=true][data-k=nr]{background:var(--nr);border-color:var(--nr);color:#fff}
.seg button[aria-pressed=true][data-k=nv]{background:var(--nv);border-color:var(--nv);color:#fff}
.extra{display:grid;gap:10px;margin-top:12px}
.qty{display:flex;align-items:center;gap:10px;font-size:.92rem}
.qty input{width:84px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;text-align:center}
.qty.diff input{border-color:var(--res);background:#FDF5E2}
textarea,.field input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;resize:vertical}
textarea{min-height:64px}
.req{color:var(--nc);font-size:.84rem;font-weight:700}
.photos{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.thumb{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#ddd;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:14px;line-height:22px;padding:0}
.add-photo{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--blue);color:var(--blue);background:var(--blue-soft);border-radius:8px;padding:10px 12px;font-weight:700;font-size:.9rem}
.add-photo input{display:none}

.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;border:0;border-radius:10px;padding:14px 20px;font-weight:700;font-size:1rem;background:var(--blue);color:#fff;min-height:52px}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#ffffffee;backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bottom-in{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center}
.bottom-in .grow{flex:1;font-size:.9rem}
.field{display:grid;gap:6px;margin-top:14px}
.field label{font-weight:700;font-size:.95rem}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:12px;background:#fff}
.choice input{margin-top:4px;accent-color:var(--blue);width:20px;height:20px}
.sig{border:1.5px solid var(--line);border-radius:10px;background:#fff;touch-action:none;width:100%;height:180px;display:block}
.notice{border-left:4px solid var(--blue);background:var(--blue-soft);padding:12px 14px;border-radius:0 10px 10px 0;font-size:.93rem}
.notice.warn{border-color:var(--res);background:#FBF1DA}
.notice.err{border-color:var(--nc);background:#F8E1DD}
.progress{height:8px;border-radius:4px;background:var(--empty);overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--blue);transition:width .3s}
.center{text-align:center}
.big-ok{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:8px auto 16px;font-size:38px}

/* Admin comparatif */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.sum .panel{margin:0}
.sum dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.9rem}
.sum dt{color:var(--muted)}.sum dd{margin:0}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 9px;background:#eef1f0;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--empty))}
.chip.ok{--c:var(--ok)}.chip.res{--c:var(--res)}.chip.nc{--c:var(--nc)}.chip.nr{--c:var(--nr)}.chip.nv{--c:var(--nv)}
.filters{display:flex;gap:8px;margin:20px 0 4px;flex-wrap:wrap}
.filters button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.88rem}
.filters button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.cmp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px}
.cmp.gap{border-color:var(--res);box-shadow:inset 6px 0 0 var(--res)}
.cmp-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.cmp-col{font-size:.9rem;min-width:0}
.cmp-col h4{margin:0 0 4px;font-size:.78rem;color:var(--muted);font-weight:700}
.cmp-col .photos .thumb{width:56px;height:56px}
.decision{display:flex;gap:10px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);flex-wrap:wrap}
.decision select{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-weight:700}
.decision input{flex:1;min-width:180px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px}
.gap-flag{font-size:.78rem;font-weight:700;color:#8a5d00;background:#FBF1DA;border-radius:6px;padding:2px 8px}
.lightbox{position:fixed;inset:0;background:#000d;z-index:50;display:grid;place-items:center;padding:20px}
.lightbox img{max-width:100%;max-height:90vh;border-radius:6px}
.print-only{display:none}
@media (max-width:560px){.sum,.cmp-cols{grid-template-columns:1fr}.seg button{font-size:.72rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .demo-bar,.top,.bottom,.filters,.no-print,.thumb .x{display:none!important}
  .print-only{display:block}
  body{background:#fff;font-size:11pt}
  .panel,.cmp{break-inside:avoid;border-color:#999}
  .wrap{padding-bottom:0}
}
</style>
</head>

/* ---------- API ---------- */
async function api(path, opts={}){
  const r = await fetch(API_BASE.replace(/\/$/,"") + path, opts);
  let j; try{ j = await r.json(); }catch(e){ throw new Error("Réponse illisible du serveur ("+r.status+")."); }
  if(j && j.error) throw new Error(j.error);
  return j;
}
const post = (path, body) => api(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});

async function load(){
  const qs = new URLSearchParams(location.search);
  S.token = qs.get("t")||"";
  if(!S.live){
    S.role = qs.get("role") || "assistante";
    S.chantier = DEMO_CHANTIER; S.points = DEMO_POINTS;
    if(!S.pvs.length) S.pvs = [demoAmenageurPV()];
    S.already = false;
    S.loading=false; S.step = S.role==="admin" ? "admin" : "intro";
    return render();
  }
  if(!S.token){ S.loading=false; S.error="Ce lien est incomplet. Ouvrez le lien exact reçu par mail ou SMS."; return render(); }
  try{
    const d = await api("/pv/chantier?t="+encodeURIComponent(S.token));
    Object.assign(S,{role:d.role, chantier:d.chantier, points:d.points, pvs:d.pvs||[], already:!!d.already_submitted});
    S.step = S.role==="admin" ? "admin" : (S.already ? "done" : "intro");
  }catch(e){ S.error = e.message; }
  S.loading=false; render();
}

function problems(p){
  const a = S.answers[p.id]; const out=[];
  if(!a||!a.statut){ out.push("Choisissez un statut."); return out; }
  if(NEEDS_PROOF.includes(a.statut)){
    if(!a.comment.trim()) out.push("Décrivez le problème.");
    if(!a.photos.length) out.push("Ajoutez au moins une photo.");
  } else if(p.photo && a.statut==="ok" && !a.photos.length) out.push("Photo obligatoire sur ce point.");
  return out;
}

/* ---------- Photos : compression + tampon date/lieu (comme un état des lieux de location) ---------- */
function stampPhoto(file){
  return new Promise((res,rej)=>{
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const max=1600; let {width:w,height:h}=img; const r=Math.min(1,max/Math.max(w,h)); w=Math.round(w*r); h=Math.round(h*r);
      const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d");
      x.drawImage(img,0,0,w,h);
      const band=Math.max(28,Math.round(h*0.045)); x.fillStyle="rgba(0,0,0,.6)"; x.fillRect(0,h-band,w,band);
      x.fillStyle="#fff"; x.font=`${Math.round(band*0.5)}px sans-serif`; x.textBaseline="middle";
      x.fillText(`${S.chantier.nom} | ${PV_TYPE[S.role]||""} | ${new Date().toLocaleString("fr-FR")}${S.geo?" | "+S.geo:""}`, 10, h-band/2);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",0.72));
    };
    img.onerror = () => rej(new Error("Image illisible")); img.src=url;
  });
}

    const gap = !!(a&&b) && (a.statut!==b.statut || (a.quantite??null)!==(b.quantite??null));
    const issue = [a,b].some(c=>c && NEEDS_PROOF.includes(K[c.statut]));
    if(!S.decisions[p.id]) S.decisions[p.id] = {statut: F[p.id]?.statut || b?.statut || a?.statut || "Conforme", commentaire: F[p.id]?.commentaire || [b?.commentaire, a?.commentaire].filter(Boolean)[0] || ""};
    return {p,a,b,gap,issue};
  });
  const nGap = rows.filter(r=>r.gap).length, nIssue = rows.filter(r=>r.issue).length;
  const shown = rows.filter(r=> S.filter==="all" ? true : S.filter==="gaps" ? r.gap : r.issue);
  const card = (pv,label) => pv ? `<div class="panel"><h3>${label}</h3><dl>
      <dt>Par</dt><dd>${esc(pv.redacteur)}${pv.societe?`, ${esc(pv.societe)}`:""}</dd>
      <dt>Le</dt><dd>${fmtDate(pv.date)}</dd><dt>Lieu</dt><dd>${esc(pv.geo||"non communiqué")}</dd>
      <dt>Avis</dt><dd><b>${esc(pv.avis)}</b></dd></dl>
      ${pv.commentaire?`<p class="small" style="margin-top:8px">« ${esc(pv.commentaire)} »</p>`:""}
      <div class="counts">${chips(tally(pv.constats.map(c=>K[c.statut])))}</div>
      ${pv.signature?`<img src="${esc(pv.signature)}" alt="Signature" style="max-width:160px;margin-top:8px">`:""}</div>`
    : `<div class="panel"><h3>${label}</h3><p class="muted" style="margin-top:8px">Pas encore transmis.</p></div>`;
  const col = (c,title) => `<div class="cmp-col"><h4>${title}</h4>${c?`<span class="chip ${K[c.statut]}">${esc(c.statut)}</span>${c.quantite!=null?` <span class="small">qté ${c.quantite}</span>`:""}
      ${c.commentaire?`<p class="small" style="margin:6px 0">${esc(c.commentaire)}</p>`:""}
      ${(c.photos||[]).length?`<div class="photos">${c.photos.map(u=>`<button class="thumb" data-a="lb-url" data-u="${esc(u)}"><img src="${esc(u)}" alt="Photo"></button>`).join("")}</div>`:""}`:`<span class="muted small">—</span>`}</div>`;
  const list = shown.map(({p,a,b,gap})=>{
    const d=S.decisions[p.id];
    return `<div class="cmp ${gap?"gap":""}">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><div><div class="pt-title">${esc(p.libelle)}</div><div class="pt-meta">${esc(p.lot)} · ${esc(p.piece||"")}${p.qty!=null?` · prévu : ${p.qty}`:""}</div></div>${gap?`<span class="gap-flag">Écart</span>`:""}</div>
      <div class="cmp-cols">${col(a,"Aménageur")}${col(b,"Assistante")}</div>
      <div class="decision">${fin?`<span class="chip ${K[d.statut]}">Retenu : ${esc(d.statut)}</span><span class="small">${esc(d.commentaire)}</span>`
        :`<label class="small"><b>Retenu</b> <select data-m="dec" data-id="${p.id}">${STATUTS.map(s=>`<option ${d.statut===s.label?"selected":""}>${s.label}</option>`).join("")}</select></label>
        <input data-m="decc" data-id="${p.id}" value="${esc(d.commentaire)}" placeholder="Réserve à reprendre par l'aménageur">`}</div>
    </div>`;}).join("") || `<p class="panel muted">Aucun point dans ce filtre.</p>`;
  const f=(k,l)=>`<button data-a="filter" data-f="${k}" aria-pressed="${S.filter===k}">${l}</button>`;
  const retained = Object.values(S.decisions).filter(d=>NEEDS_PROOF.includes(K[d.statut])).length;
  if(!S.finalAvis) S.finalAvis = retained ? "Avec réserves" : "Sans réserve";
  return `<div class="wrap">
    <div style="margin-top:24px"><p class="muted small">Devis ${esc(S.chantier.ref)} · ${esc(S.chantier.amenageur)}</p>
    <h1 style="margin-top:4px">Comparatif des PV, ${esc(S.chantier.nom)}</h1>
    <p class="muted" style="margin-top:6px">${nGap} écart(s) entre les deux PV · ${nIssue} point(s) signalé(s) par au moins une partie</p></div>
    <div class="sum">${card(am,"PV aménageur")}${card(as,"PV assistante")}</div>
    <div class="filters">${f("gaps",`Écarts (${nGap})`)}${f("issues",`Signalés (${nIssue})`)}${f("all",`Tous (${S.points.length})`)}</div>
    ${list}
    <div class="panel">
      <h2>${fin?"PV final validé":"Valider le PV final"}</h2>
      ${fin?`<p style="margin-top:8px">Validé le ${fmtDate(fin.date)} par ${esc(fin.redacteur)} : <b>${esc(fin.avis)}</b>.</p>`
      :`<p class="muted small" style="margin-top:6px">${retained} réserve(s) retenue(s). Elles seront créées dans la table Réserves pour suivi de levée.</p>
      <div class="field"><label for="fa">Décision</label><select id="fa" data-m="favis" style="padding:10px;border:1.5px solid var(--line);border-radius:8px">${["Sans réserve","Avec réserves","Refus de réception"].map(v=>`<option ${S.finalAvis===v?"selected":""}>${v}</option>`).join("")}</select></div>
      <div class="field"><label for="fc">Commentaire</label><textarea id="fc" data-m="fcomment" placeholder="Délai de levée des réserves, retenue éventuelle…">${esc(S.finalComment)}</textarea></div>
      <div class="field"><label for="fn">Validé par</label><input id="fn" data-m="fname" value="${esc(S.ident.nom)}"></div>`}
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px" class="no-print">
        ${fin?"":`<button class="btn" data-a="final" ${am&&as?"":"disabled"}>Valider le PV final</button>`}
        <button class="btn ghost" data-a="print">Imprimer / PDF</button></div>
      ${!fin&&!(am&&as)?`<p class="small muted" style="margin-top:8px">La validation s'active quand les deux PV sont reçus.</p>`:""}
    </div></div>`;
}

/* ---------- Signature ---------- */
function initSig(){
  const c=document.getElementById("sig"); if(!c) return;
  const r=c.getBoundingClientRect(), dpr=devicePixelRatio||1; c.width=r.width*dpr; c.height=r.height*dpr;
  const x=c.getContext("2d"); x.scale(dpr,dpr); x.lineWidth=2.4; x.lineCap="round"; x.strokeStyle="#16272A";
  if(S.signature){ const im=new Image(); im.onload=()=>x.drawImage(im,0,0,r.width,r.height); im.src=S.signature; }
  let on=false; const pos=e=>{const b=c.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top];};
  c.onpointerdown=e=>{on=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pos(e));};
  c.onpointermove=e=>{if(!on)return;x.lineTo(...pos(e));x.stroke();};
  c.onpointerup=c.onpointercancel=()=>{if(on){on=false;S.signature=c.toDataURL("image/png");}};
}

/* ---------- Envoi ---------- */
async function submit(){
  if(!S.signature){ alert("La signature est obligatoire."); return; }
  const payload = {
    token:S.token, redacteur:S.ident.nom.trim(), societe:S.ident.societe.trim(),
    date:new Date().toISOString(), debut:S.startedAt, geo:S.geo, avis:S.avis, commentaire:S.commentaire.trim(),
    constats:S.points.map(p=>{const a=S.answers[p.id]; return {point_id:p.id, statut:L[a.statut], quantite:a.qty===""?null:Number(a.qty), commentaire:a.comment.trim()};})
  };
  const photoJobs = [];
  S.points.forEach(p=>(S.answers[p.id].photos||[]).forEach((d,i)=>photoJobs.push({point_id:p.id,data:d,i})));
  S.step="sending"; S.send={done:0,total:photoJobs.length+2,msg:"Enregistrement des constats…"}; render();

  if(!S.live){ // démo
    for(let i=0;i<S.send.total;i++){ await new Promise(r=>setTimeout(r,120)); S.send.done++; S.send.msg=`Envoi des photos (${Math.max(0,S.send.done-1)}/${photoJobs.length})`; render(); }
    S.pvs = S.pvs.filter(p=>p.type!==PV_TYPE[S.role]).concat([{id:"pv-"+S.role,type:PV_TYPE[S.role],redacteur:payload.redacteur,societe:payload.societe,date:payload.date,geo:payload.geo,avis:payload.avis,commentaire:payload.commentaire,signature:S.signature,
      constats:payload.constats.map(c=>({...c,photos:S.answers[c.point_id].photos.slice()}))}]);
    S.step="done"; return render();
  }
  try{
    const r = await post("/pv/submit", payload);
    const map = Object.fromEntries(r.constats.map(c=>[c.point_id,c.constat_id]));
    S.send.done++; render();
    const up = async (body) => { for(let t=0;t<3;t++){ try{ return await post("/pv/photo", body); }catch(e){ if(t===2) throw e; await new Promise(r=>setTimeout(r,1500)); } } };
    await up({token:S.token, pv_id:r.pv_id, kind:"signature", filename:"signature.png", content_type:"image/png", data:S.signature.split(",")[1]});
    S.send.done++;
    for(const j of photoJobs){
      S.send.msg=`Envoi des photos (${S.send.done-1}/${photoJobs.length})`; render();
      await up({token:S.token, pv_id:r.pv_id, constat_id:map[j.point_id], kind:"photo", filename:`${j.point_id}-${j.i+1}.jpg`, content_type:"image/jpeg", data:j.data.split(",")[1]});
      S.send.done++;
    }
    S.step="done"; render();
  }catch(e){
    S.step="sign"; render();
    alert("L'envoi a échoué : "+e.message+"\nVérifiez la connexion et réessayez : vos réponses sont conservées tant que la page reste ouverte.");
  }
}

async function finalize(){
  if(!S.ident.nom.trim()){ alert("Indiquez qui valide le PV final."); return; }
  const decisions = S.points.map(p=>({point_id:p.id, ...S.decisions[p.id]}));
  if(!S.live){
    S.pvs.push({id:"pv-final",type:"Final",redacteur:S.ident.nom,date:new Date().toISOString(),avis:S.finalAvis,commentaire:S.finalComment,constats:decisions});
    S._keepScroll=true; return render();
  }
  try{
    await post("/pv/final",{token:S.token, redacteur:S.ident.nom.trim(), avis:S.finalAvis, commentaire:S.finalComment.trim(), decisions});
    S.loading=true; render(); await load();
  }catch(e){ alert("Validation impossible : "+e.message); }
}

/* ---------- Événements ---------- */
$app.addEventListener("input", e=>{
  const m=e.target.dataset.m, id=e.target.dataset.id, v=e.target.value; if(!m) return;
  if(m==="nom"||m==="fname") S.ident.nom=v; else if(m==="societe") S.ident.societe=v;
  else if(m==="qty"){ ans(id).qty=v; const p=S.points.find(x=>x.id===id); e.target.closest(".qty").classList.toggle("diff", v!=="" && Number(v)!==p.qty); }
  else if(m==="comment"){ ans(id).comment=v; }
  else if(m==="commentaire") S.commentaire=v; else if(m==="fcomment") S.finalComment=v;
  else if(m==="decc") S.decisions[id].commentaire=v;
});
$app.addEventListener("change", async e=>{
  const t=e.target, m=t.dataset.m;
  if(m==="avis") S.avis=t.value;
  if(m==="favis") S.finalAvis=t.value;
  if(m==="dec"){ S.decisions[t.dataset.id].statut=t.value; S._keepScroll=true; render(); }
  if(t.dataset.photo){
    const id=t.dataset.photo;
    for(const f of t.files){ try{ ans(id).photos.push(await stampPhoto(f)); }catch(err){ alert(err.message); } }
    S._keepScroll=true; render();
  }
});
$app.addEventListener("click", e=>{
  const el=e.target.closest("[data-a]"); if(!el) return; const a=el.dataset.a;
  if(a==="demo-role"){ const u=new URL(location); u.searchParams.set("role",el.dataset.r); history.replaceState(null,"",u); Object.assign(S,{answers:{},avis:"",signature:null,tried:false,decisions:{},finalAvis:"",ident:{nom:"",societe:""}}); S.pvs=S.pvs.filter(p=>p.type!=="Final"); load(); return; }
  if(a==="start"){
    if(!S.ident.nom.trim()){ alert("Indiquez votre nom."); return; }
    S.startedAt=new Date().toISOString();
    if(navigator.geolocation) navigator.geolocation.getCurrentPosition(p=>{S.geo=`${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)} (±${Math.round(p.coords.accuracy)} m)`;},()=>{}, {enableHighAccuracy:true,timeout:8000});
    S.step="check"; render(); scrollTo(0,0); return;
  }
  if(a==="st"){ const x=ans(el.dataset.id); x.statut = x.statut===el.dataset.k ? null : el.dataset.k; S._keepScroll=true; render(); return; }
  if(a==="rm-photo"){ e.stopPropagation(); ans(el.dataset.id).photos.splice(+el.dataset.i,1); S._keepScroll=true; render(); return; }
  if(a==="lb"){ S.lightbox=ans(el.dataset.id).photos[+el.dataset.src]; S._keepScroll=true; render(); return; }
  if(a==="lb-url"){ S.lightbox=el.dataset.u; S._keepScroll=true; render(); return; }
  if(a==="lb-close"){ S.lightbox=null; S._keepScroll=true; render(); return; }
  if(a==="jump"){ document.getElementById("lot-"+el.dataset.lot)?.scrollIntoView({behavior:"smooth"}); return; }
  if(a==="to-sign"){
    S.tried=true; const first=S.points.find(p=>problems(p).length);
    if(first){ S._keepScroll=true; render(); document.getElementById("pt-"+first.id)?.scrollIntoView({behavior:"smooth",block:"center"}); return; }
    S.step="sign"; render(); scrollTo(0,0); return;
  }
  if(a==="back-check"){ S.step="check"; render(); return; }
  if(a==="sig-clear"){ S.signature=null; render(); return; }
  if(a==="submit"){ submit(); return; }
  if(a==="filter"){ S.filter=el.dataset.f; S._keepScroll=true; render(); return; }
  if(a==="final"){ finalize(); return; }
  if(a==="print"){ window.print(); return; }
  if(a==="demo-fill"){ S.points.forEach((p,i)=>{ const x=ans(p.id); x.statut = i===10?"res":i===37?"nc":"ok"; if(p.qty!=null) x.qty = i===37?5:p.qty; if(i===10) x.comment="Traces de rouleau mur gauche salle d'attente."; if(i===37) x.comment="Seulement 5 bouches de VMC, aucune en salle de repos."; if(p.photo||i===10||i===37) x.photos=[demoPhoto(p.libelle)]; }); S._keepScroll=true; render(); return; }
});
window.addEventListener("beforeunload", e=>{ if(["check","sign","sending"].includes(S.step)){ e.preventDefault(); e.returnValue=""; } });

function demoPhoto(txt){
  const c=document.createElement("canvas"); c.width=320; c.height=240; const x=c.getContext("2d");
  x.fillStyle="#9aa8a6"; x.fillRect(0,0,320,240); x.fillStyle="#fff"; x.font="15px sans-serif"; x.fillText(txt.slice(0,38),12,120);
  return c.toDataURL("image/jpeg",0.7);
}

load();
</script>
